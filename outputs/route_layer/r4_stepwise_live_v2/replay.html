<div class="notice" id="notice"></div>
<main><section class="card">

</div><p class="feature-list" id="features"></p>

<h2>任务与地点解析</h2><div class="grid" id="task-info"></div>

<div class="panel"><h2>反馈内容</h2><pre class="pre" id="feedback"></pre></div>

<div class="panel"><h2>能耗与费用</h2><div class="grid" id="cost-info"></div><p class="small" id="energy-note"></p></div>
<div class="panel"><h2>实验状态</h2><div class="grid" id="final-info"></div></div>

const reach=DATA.route_search.reachability_preflight||{},deep=DATA.deepseek||{},usage=deep.usage||{},cost=deep.estimated_cost||{};const fi=el('final-info');row(fi,'R4 正式结果','否（单任务烟雾 / 本地预检）','bad');row(fi,'路线生成模式',mode==='stepwise'?'逐步方向提议':'整条路线');row(fi,'实际请求次数 / 上限',`${DATA.api_request_count} / ${deep.max_step_api_calls||DATA.route_search.max_step_api_calls||'—'}`);row(fi,'合计 token',usage.usage_complete===false?'未知（请求未取得完整用量）':`${usage.input_tokens??0} 输入 / ${usage.output_tokens??0} 输出`);row(fi,'用户输入累计字节',usage.serialized_user_input_bytes??'—');row(fi,'系统和用户消息累计字节',usage.serialized_messages_bytes??'—');row(fi,'API 费用估算',cost.api_cost_amount!=null&&Number.isFinite(Number(cost.api_cost_amount))?`${Number(cost.api_cost_amount).toFixed(6)} CNY`:(DATA.api_request_count?'未知（用量未返回）':'尚无请求'));row(fi,'路线耗电',cost.route_electricity_status==='calculated_from_validated_route'?'按合法路线计算':'未计算：没有通过校验的完整路线');row(fi,'有向可达预检',reach.chain_reachable?'起点—上车点—下车点均可达':'未通过');
