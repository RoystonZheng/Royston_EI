document.getElementById('legs').innerHTML=(trace.legs||[]).map((leg,i)=>'<tr><td>'+(i+1)+'</td><td>'+leg.status+'</td><td>'+leg.source_node_id+' → '+leg.target_node_id+'</td><td>'+((leg.expanded_node_ids||[]).length)+'</td></tr>').join('');
draw();
</script></body></html>
