function nodeXY(id){const m=/^node_(-?\d+)_(-?\d+)$/.exec(id||'');return m?[Number(m[1]),Number(m[2])]:null}
const B=DATA.map.boundary; function pos(x,y){return [35+(x-B.min_x)/Math.max(1,B.max_x-B.min_x)*930,720-(y-B.min_y)/Math.max(1,B.max_y-B.min_y)*660]}
function arrow(ctx,a,b){const dx=b[0]-a[0],dy=b[1]-a[1],len=Math.hypot(dx,dy);if(len<10)return;const ux=dx/len,uy=dy/len,mx=a[0]+dx*.62,my=a[1]+dy*.62;ctx.beginPath();ctx.moveTo(mx,my);ctx.lineTo(mx-ux*8+uy*4,my-uy*8-ux*4);ctx.lineTo(mx-ux*8-uy*4,my-uy*8+ux*4);ctx.closePath();ctx.fill()}
function draw(){const c=$('map'),ctx=c.getContext('2d');ctx.clearRect(0,0,c.width,c.height);ctx.lineWidth=1;ctx.strokeStyle='#d8e0eb';for(const e of DATA.map.edges){const a=pos(e[0],e[1]),b=pos(e[2],e[3]);ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke();if(e[4]){ctx.fillStyle='#7d8da5';arrow(ctx,a,b)}}for(const f of DATA.map.features){const p=pos(f.x,f.y);ctx.fillStyle='#8b5cf6';ctx.beginPath();ctx.arc(p[0],p[1],5,0,Math.PI*2);ctx.fill();ctx.fillStyle='#6042a2';ctx.font='10px sans-serif';ctx.fillText(f.label||f.feature_type,p[0]+6,p[1]-5)}const r=records[selected];if(!r)return;const ex=new Set(r.expanded_node_ids||[]);ctx.fillStyle='#2563eb66';for(const id of ex){const xy=nodeXY(id);if(!xy)continue;const p=pos(xy[0],xy[1]);ctx.beginPath();ctx.arc(p[0],p[1],3,0,Math.PI*2);ctx.fill()}const route=r.route_node_ids||[];if(route.length>1){ctx.strokeStyle='#dc2626';ctx.lineWidth=5;ctx.beginPath();route.forEach((id,i)=>{const xy=nodeXY(id);if(!xy)return;const p=pos(xy[0],xy[1]);if(i)ctx.lineTo(p[0],p[1]);else ctx.moveTo(p[0],p[1])});ctx.stroke()}[['start_node_id','#16a34a','起'],['pickup_node_id','#f59e0b','上'],['dropoff_node_id','#dc2626','终']].forEach(([key,color,label])=>{const xy=nodeXY(r[key]);if(!xy)return;const p=pos(xy[0],xy[1]);ctx.fillStyle=color;ctx.beginPath();ctx.arc(p[0],p[1],8,0,Math.PI*2);ctx.fill();ctx.fillStyle='#111827';ctx.font='bold 11px sans-serif';ctx.fillText(label,p[0]+9,p[1]-8)})}
function filtered(){const scope=$('scope').value,method=$('method').value,status=$('status').value,q=$('query').value.trim().toLowerCase();return records.map((r,i)=>({...r,_i:i})).filter(r=>(scope==='all'||r.scope===scope)&&(method==='all'||r.method_name===method)&&(status==='all'||r.status===status)).filter(r=>{if(!q)return true;return [r.task_id,r.scenario_type,r.method_name,r.start_node_id,r.pickup_node_id,r.dropoff_node_id].some(v=>String(v||'').toLowerCase().includes(q))})}
function render(){const rows=filtered();$('results').innerHTML=rows.length?rows.map(r=>`<tr class="${r._i===selected?'selected':''}" data-i="${r._i}"><td>${r.scope==='orders'?'订单':'正式'}<br><span class="muted">${r.task_id}</span>${r.scenario_type?'<br><span class="muted">'+r.scenario_type+'</span>':''}</td><td>${r.method_name}</td><td class="${r.status==='completed'?'ok':'bad'}">${r.status||'—'}</td><td>${fmt(r.compute_time_ms,2)}</td><td>${fmtEnergy(r)}</td><td>${r.start_node_id||'—'} → ${r.pickup_node_id||'—'} → ${r.dropoff_node_id||'—'}</td><td>${fmt(r.route_distance_m,1)}</td><td>${fmt(r.travel_time_sec,1)}</td><td>${r.expanded_nodes??'—'}</td><td>${fmtCost(r)}</td><td>${r.html_file?`<a href="${r.html_file}" target="_blank">HTML</a> · <a href="${r.json_file}" target="_blank">JSON</a>`:'—'}</td></tr>`).join(''):'<tr><td colspan="11" class="empty">没有匹配的结果</td></tr>';document.querySelectorAll('#results tr[data-i]').forEach(row=>row.addEventListener('click',()=>{selected=Number(row.dataset.i);render();renderDetail();draw()}));}
function renderDetail(){const r=records[selected];if(!r){$('detail').innerHTML='<div class="empty">没有结果</div>';return}$('detail').innerHTML=`<div><b>${r.scope==='orders'?'订单':'正式场景'} / ${r.task_id}</b> · <b>${r.method_name}</b> · <span class="${r.status==='completed'?'ok':'bad'}">${r.status}</span></div><div class="detail-grid"><span><b>起点：</b>${r.start_node_id||'—'}</span><span><b>上车点：</b>${r.pickup_node_id||'—'}</span><span><b>终点：</b>${r.dropoff_node_id||'—'}</span><span><b>任务类型：</b>${r.task_type||'—'}</span><span><b>场景类型：</b>${r.scenario_type||'—'}</span><span><b>计算时间：</b>${fmt(r.compute_time_ms,2)} ms</span><span><b>能耗：</b>${fmtEnergy(r)} kWh</span><span><b>路线距离：</b>${fmt(r.route_distance_m,1)} m</span><span><b>总行驶时间：</b>${fmt(r.travel_time_sec,1)} s</span><span><b>展开节点：</b>${r.expanded_nodes??'—'}</span><span><b>电费：</b>${fmtComponent(r,r.electricity_cost)} CNY</span><span><b>算力费：</b>${fmtComponent(r,r.compute_cost)} CNY</span><span><b>API 费：</b>${fmtComponent(r,r.api_cost)} CNY</span><span><b>总费用：</b>${fmtCost(r)} CNY</span><span><b>费用状态：</b>${r.cost_status||'—'}</span><span><b>校验：</b>${r.validation_status||'—'}</span><span><b>失败原因：</b>${r.failure_reason||'—'}</span></div><div><b>地点文本：</b>${r.pickup_text||'—'}；${r.dropoff_text||'—'}</div><div>${r.html_file?`<a href="${r.html_file}" target="_blank">打开逐步检索回放</a> · <a href="${r.json_file}" target="_blank">打开原始 JSON</a>`:''}</div>`}
['scope','method','status','query'].forEach(id=>$(id).addEventListener('input',()=>{render();renderDetail();draw()}));render();renderDetail();draw();
</script></body></html>
